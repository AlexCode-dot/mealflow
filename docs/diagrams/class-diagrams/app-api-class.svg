<svg width="1200" height="900" viewBox="0 0 1200 900" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="App API class diagram">
  <defs>
    <style>
      .class-box { fill: #ECECFF; stroke: #9370DB; stroke-width: 1.5; }
      .class-title { font-family: "Trebuchet MS", Verdana, Arial, sans-serif; font-size: 16px; font-weight: bold; fill: #333; }
      .class-text { font-family: "Trebuchet MS", Verdana, Arial, sans-serif; font-size: 13px; fill: #333; }
      .class-divider { stroke: #9370DB; stroke-width: 1.2; }
      .link { stroke: #333; stroke-width: 1.2; fill: none; marker-end: url(#arrow); }
      .link-label { font-family: "Trebuchet MS", Verdana, Arial, sans-serif; font-size: 12px; fill: #333; }
      .link-multiplicity { font-family: "Trebuchet MS", Verdana, Arial, sans-serif; font-size: 11px; fill: #333; }
    </style>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#333" />
    </marker>
  </defs>

  <rect x="0" y="0" width="1200" height="900" fill="#fff" />

  <!-- Profile -->
  <g id="Profile">
    <rect class="class-box" x="450" y="40" width="300" height="220" rx="4" />
    <text class="class-title" x="600" y="65" text-anchor="middle">Profile</text>
    <line class="class-divider" x1="450" y1="80" x2="750" y2="80" />
    <text class="class-text" x="465" y="100">+String id</text>
    <text class="class-text" x="465" y="118">+String userId</text>
    <text class="class-text" x="465" y="136">+String displayName</text>
    <text class="class-text" x="465" y="154">+String avatarUrl</text>
    <text class="class-text" x="465" y="172">+String theme</text>
    <text class="class-text" x="465" y="190">+Instant createdAt</text>
    <text class="class-text" x="465" y="208">+Instant updatedAt</text>
  </g>

  <!-- Recipe -->
  <g id="Recipe">
    <rect class="class-box" x="40" y="300" width="320" height="320" rx="4" />
    <text class="class-title" x="200" y="325" text-anchor="middle">Recipe</text>
    <line class="class-divider" x1="40" y1="340" x2="360" y2="340" />
    <text class="class-text" x="55" y="360">+String id</text>
    <text class="class-text" x="55" y="378">+String userId</text>
    <text class="class-text" x="55" y="396">+String title</text>
    <text class="class-text" x="55" y="414">+String description</text>
    <text class="class-text" x="55" y="432">+String imageUrl</text>
    <text class="class-text" x="55" y="450">+List&lt;Ingredient&gt; ingredients</text>
    <text class="class-text" x="55" y="468">+List&lt;String&gt; steps</text>
    <text class="class-text" x="55" y="486">+Integer cookingTimeMinutes</text>
    <text class="class-text" x="55" y="504">+Integer portions</text>
    <text class="class-text" x="55" y="522">+String category</text>
    <text class="class-text" x="55" y="540">+boolean fromExternal</text>
    <text class="class-text" x="55" y="558">+Instant createdAt</text>
    <text class="class-text" x="55" y="576">+Instant updatedAt</text>
  </g>

  <!-- Ingredient -->
  <g id="Ingredient">
    <rect class="class-box" x="70" y="680" width="260" height="120" rx="4" />
    <text class="class-title" x="200" y="705" text-anchor="middle">Ingredient</text>
    <line class="class-divider" x1="70" y1="720" x2="330" y2="720" />
    <text class="class-text" x="85" y="740">+String name</text>
    <text class="class-text" x="85" y="758">+Double quantity</text>
    <text class="class-text" x="85" y="776">+String unit</text>
  </g>

  <!-- WeeklyPlan -->
  <g id="WeeklyPlan">
    <rect class="class-box" x="430" y="300" width="340" height="240" rx="4" />
    <text class="class-title" x="600" y="325" text-anchor="middle">WeeklyPlan</text>
    <line class="class-divider" x1="430" y1="340" x2="770" y2="340" />
    <text class="class-text" x="445" y="360">+String id</text>
    <text class="class-text" x="445" y="378">+String userId</text>
    <text class="class-text" x="445" y="396">+String weeklyStart</text>
    <text class="class-text" x="445" y="414">+List&lt;PlanEntry&gt; entries</text>
    <text class="class-text" x="445" y="432">+List&lt;String&gt; sections</text>
    <text class="class-text" x="445" y="450">+Instant createdAt</text>
    <text class="class-text" x="445" y="468">+Instant updatedAt</text>
  </g>

  <!-- PlanEntry -->
  <g id="PlanEntry">
    <rect class="class-box" x="450" y="650" width="320" height="220" rx="4" />
    <text class="class-title" x="610" y="675" text-anchor="middle">PlanEntry</text>
    <line class="class-divider" x1="450" y1="690" x2="770" y2="690" />
    <text class="class-text" x="465" y="710">+String id</text>
    <text class="class-text" x="465" y="728">+String day</text>
    <text class="class-text" x="465" y="746">+String section</text>
    <text class="class-text" x="465" y="764">+String recipeId // optional</text>
    <text class="class-text" x="465" y="782">+String customTitle // optional</text>
    <text class="class-text" x="465" y="800">+List&lt;String&gt; items</text>
    <text class="class-text" x="465" y="818">+List&lt;String&gt; extraItems</text>
    <text class="class-text" x="465" y="836">+String notes</text>
    <text class="class-text" x="465" y="854">+Integer portions</text>
  </g>

  <!-- ShoppingList -->
  <g id="ShoppingList">
    <rect class="class-box" x="820" y="300" width="320" height="240" rx="4" />
    <text class="class-title" x="980" y="325" text-anchor="middle">ShoppingList</text>
    <line class="class-divider" x1="820" y1="340" x2="1140" y2="340" />
    <text class="class-text" x="835" y="360">+String id</text>
    <text class="class-text" x="835" y="378">+String userId</text>
    <text class="class-text" x="835" y="396">+ShoppingListStatus status</text>
    <text class="class-text" x="835" y="414">+String weeklyPlanId</text>
    <text class="class-text" x="835" y="432">+String title</text>
    <text class="class-text" x="835" y="450">+List&lt;ShoppingListItem&gt; items</text>
    <text class="class-text" x="835" y="468">+Instant createdAt</text>
    <text class="class-text" x="835" y="486">+Instant updatedAt</text>
  </g>

  <!-- ShoppingListItem -->
  <g id="ShoppingListItem">
    <rect class="class-box" x="860" y="650" width="280" height="160" rx="4" />
    <text class="class-title" x="1000" y="675" text-anchor="middle">ShoppingListItem</text>
    <line class="class-divider" x1="860" y1="690" x2="1140" y2="690" />
    <text class="class-text" x="875" y="710">+String id</text>
    <text class="class-text" x="875" y="728">+String name</text>
    <text class="class-text" x="875" y="746">+Double quantity</text>
    <text class="class-text" x="875" y="764">+String unit</text>
    <text class="class-text" x="875" y="782">+boolean checked</text>
  </g>

  <!-- Relationships -->
  <line class="link" x1="600" y1="260" x2="200" y2="300" />
  <text class="link-label" x="400" y="275">owns</text>
  <text class="link-multiplicity" x="585" y="255">1</text>
  <text class="link-multiplicity" x="210" y="295">0..*</text>

  <line class="link" x1="600" y1="260" x2="600" y2="300" />
  <text class="link-label" x="610" y="285">owns</text>
  <text class="link-multiplicity" x="585" y="255">1</text>
  <text class="link-multiplicity" x="605" y="295">0..*</text>

  <line class="link" x1="600" y1="260" x2="980" y2="300" />
  <text class="link-label" x="770" y="275">owns</text>
  <text class="link-multiplicity" x="585" y="255">1</text>
  <text class="link-multiplicity" x="970" y="295">0..*</text>

  <line class="link" x1="200" y1="620" x2="200" y2="680" />
  <text class="link-label" x="210" y="655">contains</text>
  <text class="link-multiplicity" x="185" y="635">1</text>
  <text class="link-multiplicity" x="205" y="675">0..*</text>

  <line class="link" x1="600" y1="540" x2="610" y2="650" />
  <text class="link-label" x="620" y="610">contains</text>
  <text class="link-multiplicity" x="585" y="555">1</text>
  <text class="link-multiplicity" x="620" y="645">0..*</text>

  <line class="link" x1="980" y1="540" x2="1000" y2="650" />
  <text class="link-label" x="1010" y="610">contains</text>
  <text class="link-multiplicity" x="965" y="555">1</text>
  <text class="link-multiplicity" x="1010" y="645">0..*</text>
</svg>
