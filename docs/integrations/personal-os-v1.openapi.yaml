openapi: 3.1.0
info:
  title: MealFlow integration API for Personal OS
  version: "1.0.1"
  description: |
    Narrow, versioned API for connected apps (Personal OS). See personal-os-v1.md for the OAuth flow,
    idempotency, ETag and isolation rules. All writes require `Idempotency-Key`.
    Changes since the v1 draft (MF1 QA, D1-D10) are listed in personal-os-v1.md, "Changes since v1 draft".
servers:
  - url: http://localhost:8082/integrations/v1
    description: Local app-api
security:
  - mealflowOAuth: []
components:
  securitySchemes:
    mealflowOAuth:
      type: oauth2
      flows:
        authorizationCode:
          authorizationUrl: http://localhost:8081/oauth2/authorize
          tokenUrl: http://localhost:8081/oauth2/token
          refreshUrl: http://localhost:8081/oauth2/token
          scopes:
            recipes.read: See your recipes
            recipes.write: Add new recipes and edit your recipes
            mealplan.read: See your meal plan for this week and next week
            mealplan.write: Add and remove meals in your meal plan
            shoppinglist.read: See your shopping lists
            shoppinglist.write: Add, remove and check off items on your shopping lists
  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: 1-255 visible ASCII chars; scoped per user+client; kept 24 h.
      schema: { type: string, minLength: 1, maxLength: 255 }
    IfMatch:
      name: If-Match
      in: header
      required: false
      description: Quoted version from a previous ETag; 412 if the resource changed.
      schema: { type: string }
    Id: { name: id, in: path, required: true, schema: { type: string } }
    ItemId: { name: itemId, in: path, required: true, schema: { type: string } }
    Week: { name: week, in: path, required: true, schema: { type: string, enum: [current, next] } }
  headers:
    ETag: { description: Quoted resource version, schema: { type: string } }
    IdempotencyReplayed: { description: "true when this is a stored replay", schema: { type: string } }
    Location: { description: Path of the created resource (recipe, meal-plan entry or shopping-list item), schema: { type: string } }
  responses:
    Problem:
      description: Error (problem+json)
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
  schemas:
    Problem:
      type: object
      description: |
        RFC 9457 problem details. The first six fields are always present. Some errors add fields:
        `errors` (bean validation, 400), `param` / `value` (bad query or path parameter, 400) and
        `retryAfterSeconds` (429). Clients must ignore fields they do not know.
      additionalProperties: true
      properties:
        type: { type: string }
        title: { type: string }
        status: { type: integer }
        detail: { type: string }
        path: { type: string }
        timestamp: { type: string, format: date-time }
        errors:
          type: array
          items:
            type: object
            properties:
              field: { type: string }
              message: { type: string }
        param: { type: string }
        value: { type: string }
        retryAfterSeconds: { type: integer }
    Ingredient:
      type: object
      description: |
        `quantity`, when set, must be > 0 and then `unit` is required (not blank). `unit` may be set
        without `quantity` ("1 nypa salt" -> name "salt", unit "nypa"). Violations answer 400.
      required: [name]
      properties:
        name: { type: string, minLength: 1, maxLength: 80, description: Not blank }
        quantity: { type: [number, "null"], exclusiveMinimum: 0 }
        unit: { type: [string, "null"], maxLength: 20 }
      if:
        required: [quantity]
        properties: { quantity: { type: number } }
      then:
        required: [unit]
        properties: { unit: { type: string, minLength: 1, pattern: "\\S" } }
    RecipeSummary:
      type: object
      properties:
        id: { type: string }
        title: { type: string }
        category: { type: [string, "null"] }
        tags: { type: array, items: { type: string } }
        cookingTimeMinutes: { type: [integer, "null"] }
        portions: { type: [integer, "null"] }
        imageUrl: { type: [string, "null"] }
        updatedAt: { type: string, format: date-time }
        version: { type: integer, format: int64 }
    RecipePage:
      type: object
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/RecipeSummary" } }
        nextCursor: { type: [string, "null"] }
    Recipe:
      type: object
      properties:
        id: { type: string }
        title: { type: string }
        description: { type: [string, "null"] }
        ingredients: { type: array, items: { $ref: "#/components/schemas/Ingredient" } }
        steps: { type: array, items: { type: string } }
        cookingTimeMinutes: { type: [integer, "null"] }
        portions: { type: [integer, "null"] }
        category: { type: [string, "null"] }
        tags: { type: array, items: { type: string } }
        imageUrl: { type: [string, "null"] }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        version: { type: integer, format: int64 }
    CreateRecipe:
      type: object
      required: [title]
      properties:
        title: { type: string, minLength: 1, maxLength: 120, description: Not blank }
        description: { type: string, maxLength: 2000 }
        ingredients: { type: array, maxItems: 100, items: { $ref: "#/components/schemas/Ingredient" } }
        steps: { type: array, maxItems: 100, items: { type: string, minLength: 1, maxLength: 500, description: Not blank } }
        cookingTimeMinutes: { type: integer, minimum: 0, maximum: 10000 }
        portions: { type: integer, minimum: 0, maximum: 1000 }
        category: { type: string, maxLength: 80, description: Free text (e.g. "Middag"), not an enum }
        tags: { type: array, maxItems: 10, items: { type: string, minLength: 1, maxLength: 40, description: Not blank } }
    UpdateRecipe:
      type: object
      description: |
        Partial update (merge semantics); every field is optional and omitted or null fields are
        unchanged. A list that is sent replaces the stored list. `title`, if sent, must not be blank.
      properties:
        title: { type: [string, "null"], minLength: 1, maxLength: 120, description: Not blank when set }
        description: { type: [string, "null"], maxLength: 2000 }
        ingredients: { type: [array, "null"], maxItems: 100, items: { $ref: "#/components/schemas/Ingredient" } }
        steps: { type: [array, "null"], maxItems: 100, items: { type: string, minLength: 1, maxLength: 500, description: Not blank } }
        cookingTimeMinutes: { type: [integer, "null"], minimum: 0, maximum: 10000 }
        portions: { type: [integer, "null"], minimum: 0, maximum: 1000 }
        category: { type: [string, "null"], maxLength: 80 }
        tags: { type: [array, "null"], maxItems: 10, items: { type: string, minLength: 1, maxLength: 40, description: Not blank } }
    MealPlanEntry:
      type: object
      properties:
        id: { type: string }
        day: { type: string, enum: [MON, TUE, WED, THU, FRI, SAT, SUN], description: Always returned in this three-letter form }
        section: { type: string, description: One of the plan's sections, in the plan's spelling }
        recipeId: { type: [string, "null"] }
        customTitle: { type: [string, "null"] }
        title: { type: [string, "null"] }
        notes: { type: [string, "null"] }
        portions: { type: [integer, "null"] }
    MealPlan:
      type: object
      description: |
        An empty week (no plan stored yet) has `id` and `updatedAt` null, `sections`
        [Breakfast, Lunch, Dinner], no entries, `version` 0 and ETag `"0"`.
      properties:
        id: { type: [string, "null"], description: null for an empty week }
        weekStart: { type: string, format: date, description: Monday of the week (Europe/Stockholm) }
        sections: { type: array, items: { type: string } }
        entries: { type: array, items: { $ref: "#/components/schemas/MealPlanEntry" } }
        updatedAt: { type: [string, "null"], format: date-time, description: null for an empty week }
        version: { type: integer, format: int64, description: 0 for an empty week }
    AddMealPlanEntry:
      type: object
      description: |
        Exactly one of `recipeId` / `customTitle` must be set (non-blank); both or neither answers 400.
        `recipeId` must be one of the caller's own recipes; an unknown or another user's recipe answers
        400 (not 404), with the same message either way.

        `section`: if the week has no plan yet, any section is accepted and the new plan's sections are
        [Breakfast, Lunch, Dinner] plus that section if it is not one of them. If the plan exists,
        `section` must match one of its `sections` (case-insensitive; the plan's spelling is stored),
        otherwise 400.
      required: [day, section]
      properties:
        day:
          type: string
          maxLength: 12
          description: |
            `MON`...`SUN` or `monday`...`sunday`, case-insensitive. Stored and returned as `MON`...`SUN`.
            Anything else answers 400.
          examples: [tuesday, TUE]
        section: { type: string, minLength: 1, maxLength: 40, description: Not blank; see the rule above }
        recipeId: { type: string, maxLength: 120 }
        customTitle: { type: string, maxLength: 120 }
        notes: { type: string, maxLength: 500 }
        portions: { type: integer, minimum: 1, maximum: 1000 }
    ShoppingListItem:
      type: object
      properties:
        id: { type: string }
        name: { type: string }
        quantity: { type: [number, "null"] }
        unit: { type: [string, "null"] }
        checked: { type: boolean }
        category:
          type: string
          enum: [produce, meat, dairy, bread, pantry, frozen, drinks, other]
          description: Always lower case. Assigned by MealFlow from the item name; not settable through this API.
    ShoppingListSummary:
      type: object
      properties:
        id: { type: string }
        title: { type: string }
        status: { type: string, enum: [active, archived] }
        itemCount: { type: integer }
        checkedCount: { type: integer }
        updatedAt: { type: string, format: date-time }
        version: { type: integer, format: int64 }
    ShoppingList:
      type: object
      properties:
        id: { type: string }
        title: { type: string }
        status: { type: string, enum: [active, archived] }
        items: { type: array, items: { $ref: "#/components/schemas/ShoppingListItem" } }
        updatedAt: { type: string, format: date-time }
        version: { type: integer, format: int64 }
    AddShoppingItem:
      type: object
      required: [name]
      properties:
        name: { type: string, minLength: 1, maxLength: 80, description: Not blank }
        quantity: { type: number, minimum: 0 }
        unit: { type: string, maxLength: 20 }
    UpdateShoppingItem:
      type: object
      required: [checked]
      properties:
        checked: { type: boolean }
paths:
  /recipes:
    get:
      summary: List / search own recipes
      security: [{ mealflowOAuth: [recipes.read] }]
      parameters:
        - { name: q, in: query, schema: { type: string, maxLength: 100 } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 20 } }
        - { name: cursor, in: query, schema: { type: string } }
      responses:
        "200": { description: Page, content: { application/json: { schema: { $ref: "#/components/schemas/RecipePage" } } } }
        default: { $ref: "#/components/responses/Problem" }
    post:
      summary: Create recipe
      security: [{ mealflowOAuth: [recipes.write] }]
      parameters: [{ $ref: "#/components/parameters/IdempotencyKey" }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/CreateRecipe" } } } }
      responses:
        "201":
          description: Created (or replayed)
          headers: { ETag: { $ref: "#/components/headers/ETag" }, Location: { $ref: "#/components/headers/Location" }, Idempotency-Replayed: { $ref: "#/components/headers/IdempotencyReplayed" } }
          content: { application/json: { schema: { $ref: "#/components/schemas/Recipe" } } }
        default: { $ref: "#/components/responses/Problem" }
  /recipes/{id}:
    parameters: [{ $ref: "#/components/parameters/Id" }]
    get:
      summary: Get recipe
      security: [{ mealflowOAuth: [recipes.read] }]
      responses:
        "200": { description: Recipe, headers: { ETag: { $ref: "#/components/headers/ETag" } }, content: { application/json: { schema: { $ref: "#/components/schemas/Recipe" } } } }
        default: { $ref: "#/components/responses/Problem" }
    patch:
      summary: Update recipe (partial)
      security: [{ mealflowOAuth: [recipes.write] }]
      parameters: [{ $ref: "#/components/parameters/IdempotencyKey" }, { $ref: "#/components/parameters/IfMatch" }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/UpdateRecipe" } } } }
      responses:
        "200": { description: Updated, headers: { ETag: { $ref: "#/components/headers/ETag" } }, content: { application/json: { schema: { $ref: "#/components/schemas/Recipe" } } } }
        default: { $ref: "#/components/responses/Problem" }
  /meal-plans/{week}:
    parameters: [{ $ref: "#/components/parameters/Week" }]
    get:
      summary: Current or next week's meal plan
      security: [{ mealflowOAuth: [mealplan.read] }]
      responses:
        "200": { description: 'Plan (empty if none: version 0, ETag "0")', headers: { ETag: { $ref: "#/components/headers/ETag" } }, content: { application/json: { schema: { $ref: "#/components/schemas/MealPlan" } } } }
        default: { $ref: "#/components/responses/Problem" }
  /meal-plans/{week}/entries:
    parameters: [{ $ref: "#/components/parameters/Week" }]
    post:
      summary: Add a meal-plan entry
      security: [{ mealflowOAuth: [mealplan.write] }]
      parameters:
        - { $ref: "#/components/parameters/IdempotencyKey" }
        - { $ref: "#/components/parameters/IfMatch", description: 'Version of the plan; "0" (or *) while the week is still empty' }
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/AddMealPlanEntry" } } } }
      responses:
        "201": { description: Updated plan, headers: { ETag: { $ref: "#/components/headers/ETag" }, Location: { $ref: "#/components/headers/Location" } }, content: { application/json: { schema: { $ref: "#/components/schemas/MealPlan" } } } }
        default: { $ref: "#/components/responses/Problem" }
  /meal-plans/{planId}/entries/{entryId}:
    parameters:
      - { name: planId, in: path, required: true, schema: { type: string } }
      - { name: entryId, in: path, required: true, schema: { type: string } }
    delete:
      summary: Remove a meal-plan entry
      security: [{ mealflowOAuth: [mealplan.write] }]
      parameters: [{ $ref: "#/components/parameters/IdempotencyKey" }, { $ref: "#/components/parameters/IfMatch" }]
      responses:
        "200": { description: Updated plan, headers: { ETag: { $ref: "#/components/headers/ETag" } }, content: { application/json: { schema: { $ref: "#/components/schemas/MealPlan" } } } }
        default: { $ref: "#/components/responses/Problem" }
  /shopping-lists:
    get:
      summary: List own shopping lists
      security: [{ mealflowOAuth: [shoppinglist.read] }]
      parameters:
        - name: status
          in: query
          required: false
          description: Only lists with this status (case-insensitive). Omitted means all. Other values answer 400.
          schema: { type: string, enum: [active, archived] }
      responses:
        "200": { description: Lists, content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/ShoppingListSummary" } } } } }
        default: { $ref: "#/components/responses/Problem" }
  /shopping-lists/{id}:
    parameters: [{ $ref: "#/components/parameters/Id" }]
    get:
      summary: Get shopping list
      security: [{ mealflowOAuth: [shoppinglist.read] }]
      responses:
        "200": { description: List, headers: { ETag: { $ref: "#/components/headers/ETag" } }, content: { application/json: { schema: { $ref: "#/components/schemas/ShoppingList" } } } }
        default: { $ref: "#/components/responses/Problem" }
  /shopping-lists/{id}/items:
    parameters: [{ $ref: "#/components/parameters/Id" }]
    post:
      summary: Add item
      security: [{ mealflowOAuth: [shoppinglist.write] }]
      parameters: [{ $ref: "#/components/parameters/IdempotencyKey" }, { $ref: "#/components/parameters/IfMatch" }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/AddShoppingItem" } } } }
      responses:
        "201": { description: Updated list, headers: { ETag: { $ref: "#/components/headers/ETag" }, Location: { $ref: "#/components/headers/Location" } }, content: { application/json: { schema: { $ref: "#/components/schemas/ShoppingList" } } } }
        default: { $ref: "#/components/responses/Problem" }
  /shopping-lists/{id}/items/{itemId}:
    parameters: [{ $ref: "#/components/parameters/Id" }, { $ref: "#/components/parameters/ItemId" }]
    patch:
      summary: Check / uncheck item
      security: [{ mealflowOAuth: [shoppinglist.write] }]
      parameters: [{ $ref: "#/components/parameters/IdempotencyKey" }, { $ref: "#/components/parameters/IfMatch" }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/UpdateShoppingItem" } } } }
      responses:
        "200": { description: Updated list, headers: { ETag: { $ref: "#/components/headers/ETag" } }, content: { application/json: { schema: { $ref: "#/components/schemas/ShoppingList" } } } }
        default: { $ref: "#/components/responses/Problem" }
    delete:
      summary: Remove item
      security: [{ mealflowOAuth: [shoppinglist.write] }]
      parameters: [{ $ref: "#/components/parameters/IdempotencyKey" }, { $ref: "#/components/parameters/IfMatch" }]
      responses:
        "200": { description: Updated list, headers: { ETag: { $ref: "#/components/headers/ETag" } }, content: { application/json: { schema: { $ref: "#/components/schemas/ShoppingList" } } } }
        default: { $ref: "#/components/responses/Problem" }
