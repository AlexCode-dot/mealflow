# Mongo (Spring Boot 4 key)
spring.mongodb.uri=${APP_API_MONGODB_URI:mongodb://root:rootpass@localhost:27018/app-db?authSource=admin}

# Identity-service Mongo (read-only, used to validate integration tokens). Defaults to the
# local mongo-identity container on port 27017.
integration-tokens.identity-mongodb.uri=${IDENTITY_SHARED_MONGODB_URI:mongodb://root:rootpass@localhost:27017/identity-db?authSource=admin}

# Make dev logs a bit nicer
logging.level.org.springframework.security=INFO
