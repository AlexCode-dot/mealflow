# Mongo for production (inject via SPRING_MONGODB_URI)
spring.mongodb.uri=${SPRING_MONGODB_URI}

# Read-only connection to the identity-service Mongo, used to validate integration tokens.
# Falls back to the primary Mongo URI if IDENTITY_SHARED_MONGODB_URI is not set separately.
integration-tokens.identity-mongodb.uri=${IDENTITY_SHARED_MONGODB_URI:${SPRING_MONGODB_URI:}}

# Production logging tune-up (adjust as needed)
logging.level.org.springframework.security=WARN
