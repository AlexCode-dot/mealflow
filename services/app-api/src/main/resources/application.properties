spring.application.name=app-api
server.port=${PORT:8082}
server.forward-headers-strategy=${FORWARD_HEADERS_STRATEGY:framework}

# Where App API should fetch the JWKS from (Identity Service)
security.jwt.jwks-uri=${IDENTITY_JWKS_URI:http://localhost:8081/.well-known/jwks.json}

# (Optional but recommended) issuer check should match Identity Service "jwt.issuer"
security.jwt.issuer=${IDENTITY_JWT_ISSUER:http://localhost:8081}

# Read-only Mongo connection to the identity-service database, used to validate integration
# tokens (Authorization: Bearer mfi_*). Falls back to the primary app-api Mongo URI in tests.
integration-tokens.identity-mongodb.uri=${IDENTITY_SHARED_MONGODB_URI:${spring.data.mongodb.uri:${spring.mongodb.uri:}}}

# External inspiration provider (TheMealDB)
inspiration.mealdb.base-url=${MEALDB_BASE_URL:https://www.themealdb.com/api/json/v2}
inspiration.mealdb.api-key=${MEALDB_API_KEY:1}

# CORS (mainly for Expo Web)
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:8083,http://localhost:19006}

# Rate limiting
app.ratelimit.enabled=${RATE_LIMIT_ENABLED:true}
app.ratelimit.api-per-minute=${RATE_LIMIT_API_PER_MINUTE:120}

# Image uploads
app.images.max-upload-bytes=${APP_IMAGES_MAX_UPLOAD_BYTES:10485760}
app.images.max-per-user=${APP_IMAGES_MAX_PER_USER:200}
app.images.max-per-day=${APP_IMAGES_MAX_PER_DAY:20}
app.images.ticket-ttl-minutes=${APP_IMAGES_TICKET_TTL_MINUTES:60}
app.images.allowed-types=${APP_IMAGES_ALLOWED_TYPES:image/jpeg,image/png,image/webp,image/heic}
app.images.external-allowed-hosts=${APP_IMAGES_EXTERNAL_ALLOWED_HOSTS:www.themealdb.com}

imagekit.private-key=${IMAGEKIT_PRIVATE_KEY:}
imagekit.public-key=${IMAGEKIT_PUBLIC_KEY:}
imagekit.url-endpoint=${IMAGEKIT_URL_ENDPOINT:}
imagekit.upload-folder=${IMAGEKIT_UPLOAD_FOLDER:/mealflow/recipes}

# Anthropic (recipe extraction)
anthropic.api-key=${ANTHROPIC_API_KEY:}
anthropic.base-url=${ANTHROPIC_BASE_URL:https://api.anthropic.com}
anthropic.model=${ANTHROPIC_MODEL:claude-sonnet-4-6}
anthropic.anthropic-version=${ANTHROPIC_API_VERSION:2023-06-01}
anthropic.max-tokens=${ANTHROPIC_MAX_TOKENS:2048}
anthropic.request-timeout-seconds=${ANTHROPIC_REQUEST_TIMEOUT_SECONDS:60}

# Recipe extraction
app.extraction.max-image-bytes=${APP_EXTRACTION_MAX_IMAGE_BYTES:10485760}
app.extraction.max-video-bytes=${APP_EXTRACTION_MAX_VIDEO_BYTES:104857600}
app.extraction.max-per-day=${APP_EXTRACTION_MAX_PER_DAY:10}
app.extraction.job-ttl-minutes=${APP_EXTRACTION_JOB_TTL_MINUTES:60}
app.extraction.max-frames=${APP_EXTRACTION_MAX_FRAMES:8}
app.extraction.frame-interval-seconds=${APP_EXTRACTION_FRAME_INTERVAL_SECONDS:3}
app.extraction.ffmpeg-timeout-seconds=${APP_EXTRACTION_FFMPEG_TIMEOUT_SECONDS:60}
app.extraction.video-max-duration-seconds=${APP_EXTRACTION_VIDEO_MAX_DURATION_SECONDS:300}
app.extraction.ffmpeg-path=${APP_EXTRACTION_FFMPEG_PATH:ffmpeg}
app.extraction.ffprobe-path=${APP_EXTRACTION_FFPROBE_PATH:ffprobe}
app.extraction.cleanup-interval-seconds=${APP_EXTRACTION_CLEANUP_INTERVAL_SECONDS:600}

spring.servlet.multipart.max-file-size=${APP_EXTRACTION_MULTIPART_MAX_SIZE:110MB}
spring.servlet.multipart.max-request-size=${APP_EXTRACTION_MULTIPART_MAX_SIZE:110MB}

# Sentry
sentry.dsn=${SENTRY_DSN:}
sentry.environment=${SENTRY_ENVIRONMENT:development}
sentry.release=${SENTRY_RELEASE:}
sentry.traces-sample-rate=${SENTRY_TRACES_SAMPLE_RATE:0.0}

# Include request-id (MDC key "requestId") in log level section
logging.pattern.level=%5p [rid:%X{requestId:-}]
