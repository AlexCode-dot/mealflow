# Quieter security logs during test runs
logging.level.org.springframework.security=INFO

# TokenProperties (prefix = jwt)
jwt.issuer=http://localhost:8081
jwt.access-token-ttl-minutes=15
jwt.refresh-token-ttl-days=30

# Disable rate limiting in tests (too many register/login calls per IP otherwise).
app.ratelimit.enabled=false

logging.level.org.mongodb.driver.cluster=ERROR
logging.level.org.mongodb.driver.connection=ERROR
