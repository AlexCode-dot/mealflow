spring.application.name=identity-service
server.port=${PORT:8081}
server.forward-headers-strategy=${FORWARD_HEADERS_STRATEGY:framework}

# JWT
jwt.issuer=${JWT_ISSUER:http://localhost:8081}
jwt.access-token-ttl-minutes=${JWT_ACCESS_TTL_MIN:15}
jwt.refresh-token-ttl-days=${JWT_REFRESH_TTL_DAYS:30}

# Integration tokens (segment is embedded in the raw token; "live" in prod, "dev" elsewhere)
integration-tokens.env-segment=${INTEGRATION_TOKEN_ENV_SEGMENT:dev}

# RSA key locations (dev default = local non-committed files)
security.rsa.private-key-path=${JWT_PRIVATE_KEY_PATH:file:./.secrets/private.pem}
security.rsa.public-key-path=${JWT_PUBLIC_KEY_PATH:file:./.secrets/public.pem}


# CORS (mainly for Expo Web)
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:8083,http://localhost:19006}

# Rate limiting
app.ratelimit.enabled=${RATE_LIMIT_ENABLED:true}
app.ratelimit.login-per-minute=${RATE_LIMIT_LOGIN_PER_MINUTE:10}
app.ratelimit.register-per-minute=${RATE_LIMIT_REGISTER_PER_MINUTE:5}
app.ratelimit.refresh-per-minute=${RATE_LIMIT_REFRESH_PER_MINUTE:30}
app.ratelimit.logout-per-minute=${RATE_LIMIT_LOGOUT_PER_MINUTE:60}
app.ratelimit.jwks-per-minute=${RATE_LIMIT_JWKS_PER_MINUTE:120}
app.ratelimit.verify-email-per-minute=${RATE_LIMIT_VERIFY_EMAIL_PER_MINUTE:20}
app.ratelimit.resend-verification-per-minute=${RATE_LIMIT_RESEND_VERIFICATION_PER_MINUTE:5}

# Email verification
app.verification.code-ttl-minutes=${APP_VERIFICATION_CODE_TTL_MINUTES:10}
app.verification.max-attempts-per-code=${APP_VERIFICATION_MAX_ATTEMPTS_PER_CODE:5}
app.verification.resend-cooldown-seconds=${APP_VERIFICATION_RESEND_COOLDOWN_SECONDS:60}

# Resend (transactional email)
resend.api-key=${RESEND_API_KEY:}
resend.base-url=${RESEND_BASE_URL:https://api.resend.com}
resend.from-email=${RESEND_FROM_EMAIL:onboarding@resend.dev}
resend.from-name=${RESEND_FROM_NAME:MealFlow}
resend.product-name=${RESEND_PRODUCT_NAME:MealFlow}
resend.request-timeout-seconds=${RESEND_REQUEST_TIMEOUT_SECONDS:10}

# Sentry
sentry.dsn=${SENTRY_DSN:}
sentry.environment=${SENTRY_ENVIRONMENT:development}
sentry.release=${SENTRY_RELEASE:}
sentry.traces-sample-rate=${SENTRY_TRACES_SAMPLE_RATE:0.0}

# Include request-id (MDC key "requestId") in log level section
logging.pattern.level=%5p [rid:%X{requestId:-}]

# Admin API (used by the admin-all-apps cross-app panel).
# OFF unless ADMIN_API_TOKEN is set to a long random secret (>= 32 chars).
# Empty allowedIps list = no IP restriction (dev/test). In production set
# this to the admin-panel egress IP (single Railway service).
admin.api.token=${ADMIN_API_TOKEN:}
admin.api.allowed-ips=${ADMIN_ALLOWED_IPS:}

# Reported back via /api/admin/health so the panel can show what's deployed.
app.version=${APP_VERSION:0.0.0}
