<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:fragment="head(title)">
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title th:text="${title}">MealFlow</title>
  <style>
    :root { color-scheme: light dark; --bg:#f7f5f0; --card:#fff; --fg:#1f2937; --muted:#6b7280; --accent:#2f7d4f; --border:#e5e7eb; --err:#b91c1c; }
    @media (prefers-color-scheme: dark) { :root { --bg:#111614; --card:#1b211e; --fg:#f3f4f6; --muted:#9ca3af; --border:#2d3631; --accent:#4fb37a; --err:#f87171; } }
    body { margin:0; background:var(--bg); color:var(--fg); font-family:-apple-system,"Segoe UI",Roboto,sans-serif; }
    main { max-width:420px; margin:0 auto; padding:32px 16px; }
    .card { background:var(--card); border:1px solid var(--border); border-radius:16px; padding:24px; }
    h1 { font-size:22px; margin:0 0 8px; } p { line-height:1.5; }
    .muted { color:var(--muted); font-size:14px; }
    label { display:block; font-size:14px; margin:16px 0 6px; }
    input[type=email], input[type=password], input[type=text] { width:100%; box-sizing:border-box; padding:12px; border:1px solid var(--border); border-radius:10px; font-size:16px; background:transparent; color:var(--fg); }
    button { width:100%; margin-top:20px; padding:13px; border:0; border-radius:10px; font-size:16px; font-weight:600; background:var(--accent); color:#fff; cursor:pointer; }
    button.secondary { background:transparent; color:var(--fg); border:1px solid var(--border); margin-top:10px; }
    .error { color:var(--err); font-size:14px; margin-top:12px; } .info { color:var(--muted); font-size:14px; margin-top:12px; }
    ul.scopes { list-style:none; padding:0; margin:16px 0 0; } ul.scopes li { padding:10px 0; border-top:1px solid var(--border); display:flex; gap:10px; align-items:flex-start; }
    a { color:var(--accent); }
  </style>
</head>
</html>
